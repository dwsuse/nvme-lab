# The pre-OS model's NBFT boot with network-legacy: network-legacy matches
# interface names only, so dracut renames the HFI's interface to nbft0, as
# without the pre-OS model. nvme connects through nbft0 and records it for
# the OS environment, which keeps the name.
name = "pre-OS NBFT boot with network-legacy, renamed"
tags = ["pre-os", "nbft", "nvme-cli-3", "network-legacy"]

[boot]
nbft_ssns = ["extra,nonboot"]
network = "legacy"

[expect]
result = "pass"
controllers = ["root", "extra"]
owners = { root = "pre-os", extra = "pre-os" }
host_iface = { root = "nbft0", extra = "nbft0" }
iface_names = { nbft0 = "nbft0" }
