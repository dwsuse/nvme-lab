# rd.nvmf.nonbft: the initrd doesn't parse the NBFT, but with no other
# source the initqueue times out, and its last resort, a plain
# "nvme connect-all", connects the NBFT's subsystems too: the guest boots
# from the NBFT's root (dracut-ng/dracut#2820 review).
name = "NBFT ignored with rd.nvmf.nonbft until the initqueue timeout"
tags = ["nbft"]

[boot]
nbft = true
append = ["rd.nvmf.nonbft"]
timeout = 150

[expect]
result = "pass"
controllers = ["root"]
