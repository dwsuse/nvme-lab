# The pre-OS model's NBFT boot over VLAN 10 with networkd: the HFI keeps
# its name, its .network matches the MAC address and makes the VLAN
# interface nbft0.10 on it. nvme connects through nbft0.10.
name = "pre-OS NBFT boot over a VLAN, networkd, no rename"
tags = ["pre-os", "nbft", "nvme-cli-3", "vlan"]


[boot]
nbft = true
vlan = 10

[expect]
result = "pass"
controllers = ["root"]
owners = { root = "pre-os" }
host_iface = { root = "nbft0.10" }
iface_names = { nbft0 = "" }
